org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
kotlin.code.style=official

# The one place to change the app version: YY.M.N, the Nth release of that month (see RELEASING.md).
# versionCode goes up by one every release.
lockon.version=26.11.4
lockon.versionCode=28

# Where installed apps look for updates: the lock-on-update.json that `releaseArtifacts` writes into
# dist/. It must be publicly readable. Leave it empty to build without update checks.
lockon.updateFeed=https://github.com/tsunsora/lock-on/releases/latest/download/lock-on-update.json
